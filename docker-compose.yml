services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paywatch-api
    restart: unless-stopped
    ports:
      - "8020:8020"
    volumes:
      - ./auth.db:/app/auth.db
      - ./audit_log.csv:/app/audit_log.csv
      - ./data:/app/data
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      PAYWATCH_REDIS_REQUIRED: "false"
      PAYWATCH_KAFKA_ENABLED: "true"
      PAYWATCH_KAFKA_REQUIRED: "false"
      PAYWATCH_KAFKA_BOOTSTRAP_SERVERS: "kafka:19092"
      PAYWATCH_KAFKA_TOPIC: "paywatch-transactions"
      PAYWATCH_STREAM_SOURCE: "kafka"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/healthz', timeout=10).read()"]
      interval: 20s
      timeout: 10s
      retries: 8

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: paywatch-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
      - "3014:80"
    depends_on:
      api:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: paywatch-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.0.2
    container_name: paywatch-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:19092,PLAINTEXT_HOST://127.0.0.1:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9092'"]
      interval: 15s
      timeout: 10s
      retries: 15
